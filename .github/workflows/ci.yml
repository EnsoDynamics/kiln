name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  # The release workflow runs these same checks before it publishes.
  workflow_call:

# macOS is the natively validated release platform. Linux/Windows remain best effort;
# their automated checks detect compatibility regressions but do not establish native
# agent, console or sleep behavior (PRD AC-INSTALL-03, 2026-10-25 decision).
# All runners also install and exercise the packed package (AC-INSTALL-01).
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:package
