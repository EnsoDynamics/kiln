name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

# Kiln v1 runs on macOS, Linux and Windows (PRD AC-INSTALL-03). Until the Windows run of the
# proof gates before release, these runners are how that criterion is held: every push runs
# the unit tests and the integration tests (real git against temporary repositories, and the
# built `kiln` command) on all three.
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
