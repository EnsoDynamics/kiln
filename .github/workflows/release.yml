name: Release

# Every push to main is a production release. It runs the platform checks once, then
# publishes that checked archive; its generated tag runs no CI.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_failed_run:
        description: To publish over failed checks, the ID of a failed Release run of the commit now on main; its checked package is published without rerunning anything
        type: string
        default: ''
      reason:
        description: Why the failed checks don't block this release (required with publish_failed_run; shown in the release notes)
        type: string
        default: ''

permissions:
  contents: read

# Finish each release before another starts; never cancel an active npm publish.
concurrency:
  group: kiln-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Release version and publishing preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: check
        run: node scripts/release.mjs preflight
        env:
          NPM_AUTH_MODE: ${{ vars.NPM_AUTH_MODE }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  verify:
    needs: preflight
    if: ${{ !inputs.publish_failed_run }}
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  # Publishing over failed checks: Doug's choice when a release is waiting on a test failure that
  # doesn't matter for it. Only checks can be overridden: the failed run must be a Release run of the
  # commit now on main whose preflight and package build passed, so the package it built and
  # checksummed is the one published, and this run's preflight still gates the version.
  override:
    name: Publish over failed checks
    needs: preflight
    if: ${{ inputs.publish_failed_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      filename: ${{ steps.check.outputs.filename }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN: ${{ inputs.publish_failed_run }}
          REASON: ${{ inputs.reason }}
        run: node scripts/release.mjs override "$FAILED_RUN"

  publish:
    needs: [preflight, verify, override]
    # A normal release publishes once verification passes; an override publishes the failed run's
    # package once the override check passes.
    if: ${{ always() && needs.preflight.result == 'success' && (needs.verify.result == 'success' || needs.verify.result == 'skipped' && needs.override.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # npm trusted publishing requires npm 11.5.1 or later.
      - run: npm install --global npm@11
      - uses: actions/download-artifact@v8
        with:
          name: kiln-npm-package
          path: ${{ runner.temp }}/kiln-package
          run-id: ${{ inputs.publish_failed_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify the checked package
        working-directory: ${{ runner.temp }}/kiln-package
        run: sha256sum --check SHA256SUMS
      - name: Publish the checked archive without rebuilding
        env:
          PACKAGE_FILE: ${{ runner.temp }}/kiln-package/${{ needs.verify.outputs.filename || needs.override.outputs.filename }}
          NODE_AUTH_TOKEN: ${{ vars.NPM_AUTH_MODE == 'token' && secrets.NPM_TOKEN || '' }}
        run: npm publish "$PACKAGE_FILE" --access public --provenance --ignore-scripts
      - name: Write the release notes from the changelog
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          FAILED_RUN: ${{ inputs.publish_failed_run }}
          REASON: ${{ inputs.reason }}
        run: node scripts/release.mjs notes "$RELEASE_VERSION" > "$RUNNER_TEMP/kiln-release-notes.md"
      - name: Create the version tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          PACKAGE_FILE: ${{ runner.temp }}/kiln-package/${{ needs.verify.outputs.filename || needs.override.outputs.filename }}
          CHECKSUM_FILE: ${{ runner.temp }}/kiln-package/SHA256SUMS
        run: gh release create "v$RELEASE_VERSION" "$PACKAGE_FILE" "$CHECKSUM_FILE" --target "$GITHUB_SHA" --title "Kiln $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/kiln-release-notes.md"
